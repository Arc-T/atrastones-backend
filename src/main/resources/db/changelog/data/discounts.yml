databaseChangeLog:
  - changeSet:
      id: 1771151058862-1
      author: Mr.Arc-T
      changes:
        - insert:
            tableName: discounts
            columns:
              - column:
                  name: name
                  value: 'تخفیف ویژه افتتاح سایت'
              - column:
                  name: discountable_type
                  value: 'REGULAR'
              - column:
                  name: discount_type_id
                  valueNumeric: '1'
              - column:
                  name: discount_scope_id
                  valueNumeric: '1'
              - column:
                  name: amount
                  valueNumeric: '10'
              - column:
                  name: selection_type
                  value: 'ALL'
              - column:
                  name: start_date
                  valueComputed: 'CURRENT_TIMESTAMP'
              - column:
                  name: expire_date
                  valueComputed: "(CURRENT_TIMESTAMP + INTERVAL '10' DAY)"
              - column:
                  name: is_active
                  valueBoolean: 'TRUE'
              - column:
                  name: description
                  value: 'به مناسبت افتتاح سایت، تخفیف 10% برای همه ی محصولات اعمال شده'