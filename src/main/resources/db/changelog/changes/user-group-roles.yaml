databaseChangeLog:
  - changeSet:
      id: 1767965068461-1
      author: Mr.Arc-T
      changes:
        - createTable:
            tableName: user_group_roles
            remarks: Maps roles to user groups
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: role_id
                  type: ${integer_value.type}
                  constraints:
                    nullable: false
                    foreignKeyName: fk_user_group_roles_role
                    references: roles(id)
                    deleteCascade: true

              - column:
                  name: user_group_id
                  type: ${integer_value.type}
                  constraints:
                    nullable: false
                    foreignKeyName: fk_user_group_roles_user_group
                    references: user_groups(id)

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            tableName: user_group_roles
            indexName: idx_user_group_roles_role
            columns:
              - column:
                  name: role_id

        - createIndex:
            tableName: user_group_roles
            indexName: idx_user_group_roles_user_group
            columns:
              - column:
                  name: user_group_id

        - createIndex:
            unique: true
            tableName: user_group_roles
            indexName: idx_user_group_roles_unique
            columns:
              - column:
                  name: role_id
              - column:
                  name: user_group_id