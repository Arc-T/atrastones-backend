databaseChangeLog:
  - changeSet:
      id: 1767965120624-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: shop
            tableName: shop_members
            remarks: Shop staff members with their status
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: shop_id
                  type: ${id.type}
                  constraints:
                    nullable: false
                    foreignKeyName: fk_shop_members_shop
                    references: shops(id)

              - column:
                  name: user_id
                  type: ${id.type}
                  constraints:
                    nullable: false
                    foreignKeyName: fk_shop_members_user
                    references: users(id)

              - column:
                  name: description
                  type: ${long_text.type}
                  constraints:
                    nullable: true

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: ${timestamp_value.type}
                  constraints:
                    nullable: true

        - createIndex:
            schemaName: shop
            tableName: shop_members
            indexName: idx_shop_members_shop
            columns:
              - column:
                  name: shop_id

        - createIndex:
            schemaName: shop
            tableName: shop_members
            indexName: idx_shop_members_user
            columns:
              - column:
                  name: user_id

        - createIndex:
            unique: true
            schemaName: shop
            tableName: shop_members
            indexName: idx_shop_members_unique
            columns:
              - column:
                  name: user_id
              - column:
                  name: shop_id