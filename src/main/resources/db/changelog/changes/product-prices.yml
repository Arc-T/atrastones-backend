databaseChangeLog:
  - changeSet:
      id: 1767965225839-1
      author: Mr.Arc-T
      changes:
        - createTable:
            tableName: product_prices
            remarks: Stores product prices with different currencies
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: product_id
                  type: ${integer_value.type}
                  constraints:
                    nullable: false
                    foreignKeyName: fk_product_prices_product
                    references: products(id)

              - column:
                  name: base_price
                  type: ${price.type}
                  constraints:
                    nullable: false

              - column:
                  name: is_active
                  type: BOOLEAN
                  constraints:
                    nullable: false


              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false


        - createIndex:
            tableName: product_prices
            indexName: idx_product_prices_base_price
            columns:
              - column:
                  name: base_price

        - createIndex:
            tableName: product_prices
            indexName: idx_product_prices_product
            columns:
              - column:
                  name: product_id