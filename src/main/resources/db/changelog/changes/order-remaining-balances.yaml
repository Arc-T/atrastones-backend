databaseChangeLog:
  - changeSet:
      id: 1767965263358-1
      author: Mr.Arc-T
      changes:
        - createTable:
            tableName: order_remaining_balances
            remarks: Tracks remaining order balances
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: order_id
                  type: ${integer_value.type}
                  constraints:
                    nullable: false
                    foreignKeyName: fk