databaseChangeLog:
  - changeSet:
      id: 1767965159792-1
      author: Mr.Arc-T
      changes:
        - createTable:
            tableName: services
            remarks: Stores services with costs in Toman
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: ${name.type}
                  constraints:
                    unique: true
                    nullable: false

              - column:
                  name: cost
                  type: ${integer_value.type}
                  constraints:
                    nullable: false
                  remarks: Cost in Toman

              - column:
                  name: service_group_id
                  type: ${integer_value.type}
                  constraints:
                    nullable: false
                    foreignKeyName: fk_services_group
                    references: service_groups(id)

              - column:
                  name: description
                  type: ${long_text.type}
                  constraints:
                    nullable: true

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: ${timestamp_value.type}
                  constraints:
                    nullable: true

              - column:
                  name: deleted_at
                  type: ${timestamp_value.type}
                  constraints:
                    nullable: true

        - createIndex:
            tableName: services
            indexName: idx_services_group
            columns:
              - column:
                  name: service_group_id