databaseChangeLog:
  - changeSet:
      id: 1767965244600-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: ordering
            tableName: order_transactions
            remarks: Tracks order status changes
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: order_id
                  type: ${integer_value.type}
                  constraints:
                    nullable: false
                    foreignKeyName: fk_transactions_order
                    references: orders(id)
                    deleteCascade: true

              - column:
                  name: status_id
                  type: ${integer_value.type}
                  constraints:
                    nullable: false
                    foreignKeyName: fk_transactions_status
                    references: order_statuses(id)

              - column:
                  name: description
                  type: ${long_text.type}
                  constraints:
                    nullable: true

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            schemaName: ordering
            tableName: order_transactions
            indexName: idx_transactions_order
            columns:
              - column:
                  name: order_id
              - column:
                  name: created_at

        - createIndex:
            schemaName: ordering
            tableName: order_transactions
            indexName: idx_transactions_status
            columns:
              - column:
                  name: status_id