databaseChangeLog:
  - changeSet:
      id: 1767965244600-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: ordering
            tableName: order_transactions
            remarks: Tracks order status changes
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    nullable: false

              - column:
                  name: order_id
                  type: ${integer_value.type}
                  constraints:
                    nullable: false

              - column:
                  name: status_id
                  type: ${integer_value.type}
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: ${long_text.type}
                  constraints:
                    nullable: true

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addPrimaryKey:
            schemaName: ordering
            tableName: order_transactions
            columnNames: id
            constraintName: pk_order_transactions

        - addForeignKeyConstraint:
            baseTableSchemaName: ordering
            baseTableName: order_transactions
            baseColumnNames: order_id
            referencedTableSchemaName: ordering
            referencedTableName: orders
            referencedColumnNames: id
            constraintName: fk_transactions_order
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableSchemaName: ordering
            baseTableName: order_transactions
            baseColumnNames: status_id
            referencedTableSchemaName: ordering
            referencedTableName: order_statuses
            referencedColumnNames: id
            constraintName: fk_transactions_status

        - createIndex:
            schemaName: ordering
            tableName: order_transactions
            indexName: idx_transactions_order
            columns:
              - column:
                  name: order_id
              - column:
                  name: created_at

        - createIndex:
            schemaName: ordering
            tableName: order_transactions
            indexName: idx_transactions_status
            columns:
              - column:
                  name: status_id
