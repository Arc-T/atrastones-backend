databaseChangeLog:
  - changeSet:
      id: 1767965300000-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: ordering
            tableName: shipments
            remarks: Tracks shipment and delivery info per shop within an order
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    nullable: false

              - column:
                  name: order_id
                  type: ${integer_value.type}
                  constraints:
                    nullable: false

              - column:
                  name: shop_id
                  type: ${integer_value.type}
                  constraints:
                    nullable: false

              - column:
                  name: tracking_number
                  type: ${short_text.type}
                  constraints:
                    nullable: true

              - column:
                  name: carrier
                  type: ${name.type}
                  constraints:
                    nullable: true

              - column:
                  name: status
                  # type: ENUM('PENDING', 'PREPARING', 'SHIPPED', 'IN_TRANSIT', 'DELIVERED', 'RETURNED')
                  type: VARCHAR(500)
                  defaultValue: PENDING
                  constraints:
                    nullable: false

              - column:
                  name: shipped_at
                  type: ${timestamp_value.type}
                  constraints:
                    nullable: true

              - column:
                  name: delivered_at
                  type: ${timestamp_value.type}
                  constraints:
                    nullable: true

              - column:
                  name: description
                  type: ${long_text.type}
                  constraints:
                    nullable: true

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: ${timestamp_value.type}
                  constraints:
                    nullable: true

        - addPrimaryKey:
            schemaName: ordering
            tableName: shipments
            columnNames: id
            constraintName: pk_shipments

        - addForeignKeyConstraint:
            baseTableSchemaName: ordering
            baseTableName: shipments
            baseColumnNames: order_id
            referencedTableSchemaName: ordering
            referencedTableName: orders
            referencedColumnNames: id
            constraintName: fk_shipments_order
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableSchemaName: ordering
            baseTableName: shipments
            baseColumnNames: shop_id
            referencedTableName: shops
            referencedColumnNames: id
            constraintName: fk_shipments_shop

        - createIndex:
            schemaName: ordering
            tableName: shipments
            indexName: idx_shipments_order
            columns:
              - column:
                  name: order_id

        - createIndex:
            schemaName: ordering
            tableName: shipments
            indexName: idx_shipments_shop
            columns:
              - column:
                  name: shop_id

        - createIndex:
            schemaName: ordering
            tableName: shipments
            indexName: idx_shipments_status
            columns:
              - column:
                  name: status

        - createIndex:
            schemaName: ordering
            tableName: shipments
            indexName: idx_shipments_tracking_number
            columns:
              - column:
                  name: tracking_number
