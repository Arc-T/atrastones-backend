databaseChangeLog:
  - changeSet:
      id: 1767965196369-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: ordering
            tableName: order_details
            remarks: Stores order line items
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    nullable: false

              - column:
                  name: order_id
                  type: ${integer_value.type}
                  constraints:
                    nullable: false

              - column:
                  name: item_type
                  # type: ENUM('PRODUCT', 'SERVICE_OFFERING')
                  type: VARCHAR(500)
                  constraints:
                    nullable: false

              - column:
                  name: item_id
                  type: ${integer_value.type}
                  constraints:
                    nullable: false

              - column:
                  name: quantity
                  type: ${integer_value.type}
                  constraints:
                    nullable: false

              - column:
                  name: unit_price
                  type: ${integer_value.type}
                  remarks: Unit price in Toman
                  constraints:
                    nullable: false

              - column:
                  name: discount_id
                  type: ${integer_value.type}
                  constraints:
                    nullable: true

              - column:
                  name: discount_amount
                  type: ${integer_value.type}
                  defaultValue: '0'
                  remarks: Discount per item in Toman
                  constraints:
                    nullable: true

              - column:
                  name: total_price
                  type: ${integer_value.type}
                  remarks: Total after discount in Toman
                  constraints:
                    nullable: false

              - column:
                  name: status
                  # type: ENUM('PENDING', 'COMPLETED', 'CANCELLED')
                  type: VARCHAR(500)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: ${long_text.type}
                  constraints:
                    nullable: true

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addPrimaryKey:
            schemaName: ordering
            tableName: order_details
            columnNames: id
            constraintName: pk_order_details

#        - addCheckConstraint:
#            schemaName: ordering
#            tableName: order_details
#            constraintName: ck_order_details_item_type
#            constraintBody: item_type IN ('PRODUCT', 'SERVICE_OFFERING')

        - addForeignKeyConstraint:
            baseTableSchemaName: ordering
            baseTableName: order_details
            baseColumnNames: order_id
            referencedTableSchemaName: ordering
            referencedTableName: orders
            referencedColumnNames: id
            constraintName: fk_details_order

#        - addForeignKeyConstraint:
#            baseTableSchemaName: ordering
#            baseTableName: order_details
#            baseColumnNames: shop_id
#            referencedTableName: shops
#            referencedTableSchemaName: shop
#            referencedColumnNames: id
#            constraintName: fk_details_shop

        - addForeignKeyConstraint:
            baseTableSchemaName: ordering
            baseTableName: order_details
            baseColumnNames: discount_id
            referencedTableName: discounts
            referencedTableSchemaName: promotion
            referencedColumnNames: id
            constraintName: fk_details_discount

        - createIndex:
            schemaName: ordering
            tableName: order_details
            indexName: idx_order_details_order
            columns:
              - column:
                  name: order_id

        - createIndex:
            schemaName: ordering
            tableName: order_details
            indexName: idx_order_details_discount
            columns:
              - column:
                  name: discount_id
