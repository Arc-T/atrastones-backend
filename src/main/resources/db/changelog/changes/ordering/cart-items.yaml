databaseChangeLog:
  - changeSet:
      id: 1767965286066-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: ordering
            tableName: cart_items
            remarks: Stores items in user carts
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: cart_id
                  type: ${integer_value.type}
                  constraints:
                    nullable: false
                    foreignKeyName: fk_cart_items_cart
                    references: carts(id)
                    deleteCascade: true

              - column:
                  name: item_type
                  type: ${short_text.type}
                  constraints:
                    nullable: false
                    checkConstraint: item_type IN ('PRODUCT', 'SERVICE')

              - column:
                  name: item_id
                  type: ${integer_value.type}
                  constraints:
                    nullable: false

              - column:
                  name: quantity
                  type: ${integer_value.type}
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: ${timestamp_value.type}
                  constraints:
                    nullable: true

        - createIndex:
            schemaName: ordering
            tableName: cart_items
            indexName: idx_cart_items_cart
            columns:
              - column:
                  name: cart_id