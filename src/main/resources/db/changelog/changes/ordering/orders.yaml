databaseChangeLog:
  - changeSet:
      id: 1767965190733-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: ordering
            tableName: orders
            remarks: Stores customer orders
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: ${integer_value.type}
                  constraints:
                    nullable: false

              - column:
                  name: address_id
                  type: ${integer_value.type}
                  remarks: Delivery address
                  constraints:
                    nullable: true

              - column:
                  name: total_price
                  type: ${integer_value.type}
                  remarks: Total in Toman
                  constraints:
                    nullable: false

              - column:
                  name: status
                  # type: ENUM('PENDING', 'PROCESSING', 'SHIPPED', 'DELIVERED', 'CANCELLED')
                  type: VARCHAR(500)
                  defaultValue: PENDING
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: ${long_text.type}
                  constraints:
                    nullable: true

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: ${timestamp_value.type}
                  constraints:
                    nullable: true

              - column:
                  name: deleted_at
                  type: ${timestamp_value.type}
                  constraints:
                    nullable: true

        - addPrimaryKey:
            schemaName: ordering
            tableName: orders
            columnNames: id
            constraintName: pk_orders

        - addForeignKeyConstraint:
            baseTableSchemaName: ordering
            baseTableName: orders
            baseColumnNames: user_id
            referencedTableName: users
            referencedTableSchemaName: identity
            referencedColumnNames: id
            constraintName: fk_orders_user

        - addForeignKeyConstraint:
            baseTableSchemaName: ordering
            baseTableName: orders
            baseColumnNames: address_id
            referencedTableName: addresses
            referencedTableSchemaName: identity
            referencedColumnNames: id
            constraintName: fk_orders_address

        - createIndex:
            schemaName: ordering
            tableName: orders
            indexName: idx_orders_user
            columns:
              - column:
                  name: user_id
              - column:
                  name: status

        - createIndex:
            schemaName: ordering
            tableName: orders
            indexName: idx_orders_address
            columns:
              - column:
                  name: address_id

        - createIndex:
            schemaName: ordering
            tableName: orders
            indexName: idx_orders_created_at
            columns:
              - column:
                  name: created_at
