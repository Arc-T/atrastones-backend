databaseChangeLog:
  - changeSet:
      id: 1767965180807-1
      author: Mr.Arc-T
      changes:
        - createTable:
            tableName: products
            remarks: Stores product basic info
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: ${name.type}
                  constraints:
                    nullable: false

              - column:
                  name: category_id
                  type: ${integer_value.type}
                  constraints:
                    nullable: false
                    foreignKeyName: fk_products_category
                    references: categories(id)

              - column:
                  name: shop_id
                  type: ${integer_value.type}
                  constraints:
                    nullable: false
                    foreignKeyName: fk_products_shop
                    references: shops(id)

              - column:
                  name: quantity
                  type: ${integer_value.type}
                  constraints:
                    nullable: false

              - column:
                  name: service_group_id
                  type: ${integer_value.type}
                  constraints:
                    nullable: false
                    foreignKeyName: fk_products_service_group
                    references: service_groups(id)

              - column:
                  name: status
                  #                  type: ENUM('ACTIVE', 'INACTIVE', 'OUT_OF_STOCK')
                  type: VARCHAR(500)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: ${long_text.type}
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: ${timestamp_value.type}
                  constraints:
                    nullable: true

              - column:
                  name: deleted_at
                  type: ${timestamp_value.type}
                  constraints:
                    nullable: true

        - createIndex:
            tableName: products
            indexName: idx_products_shop
            columns:
              - column:
                  name: shop_id

        - createIndex:
            tableName: products
            indexName: idx_products_status
            columns:
              - column:
                  name: status