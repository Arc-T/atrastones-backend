databaseChangeLog:
  - changeSet:
      id: 1767965080617-1
      author: Mr.Arc-T
      changes:
        - createTable:
            tableName: vip_memberships
            remarks: Tracks user VIP memberships
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: vip_group_id
                  type: ${integer_value.type}
                  constraints:
                    nullable: false
                    foreignKeyName: fk_vip_memberships_group
                    references: vip_groups(id)

              - column:
                  name: user_id
                  type: ${integer_value.type}
                  constraints:
                    nullable: false
                    foreignKeyName: fk_vip_memberships_user
                    references: users(id)

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            tableName: vip_memberships
            indexName: idx_vip_memberships_group
            columns:
              - column:
                  name: vip_group_id

        - createIndex:
            tableName: vip_memberships
            indexName: idx_vip_memberships_user
            columns:
              - column:
                  name: user_id

        - createIndex:
            unique: true
            tableName: vip_memberships
            indexName: idx_vip_memberships_unique
            columns:
              - column:
                  name: user_id
              - column:
                  name: vip_group_id