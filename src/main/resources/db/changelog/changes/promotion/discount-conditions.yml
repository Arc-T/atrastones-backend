databaseChangeLog:
  - changeSet:
      id: 1771144491901-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: promotion
            tableName: discount_conditions
            remarks: Discount eligibility conditions with flexible logic
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    nullable: false

              - column:
                  name: discount_id
                  type: ${id.type}
                  constraints:
                    nullable: false

              - column:
                  name: condition_group
                  type: ${id.type}
                  defaultValue: '1'
                  remarks: Group number for AND/OR logic
                  constraints:
                    nullable: false

              - column:
                  name: type
                  type: ${name.type}
                  remarks: MIN_ORDER_AMOUNT, CUSTOMER_SEGMENT, PRODUCT_CATEGORY, etc.
                  constraints:
                    nullable: false

              - column:
                  name: operator
                  # type: ENUM('EQ', 'NEQ', 'GT', 'GTE', 'LT', 'LTE', 'IN', 'NOT_IN', 'BETWEEN', 'CONTAINS')
                  type: VARCHAR(500)
                  constraints:
                    nullable: false

              - column:
                  name: first_value
                  type: ${short_text.type}
                  remarks: Depends on condition_type
                  constraints:
                    nullable: true

              - column:
                  name: second_value
                  type: ${short_text.type}
                  remarks: For BETWEEN operations
                  constraints:
                    nullable: true

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addPrimaryKey:
            schemaName: promotion
            tableName: discount_conditions
            columnNames: id
            constraintName: pk_discount_conditions

        - addForeignKeyConstraint:
            baseTableSchemaName: promotion
            baseTableName: discount_conditions
            baseColumnNames: discount_id
            referencedTableSchemaName: promotion
            referencedTableName: discounts
            referencedColumnNames: id
            constraintName: fk_discount_conditions_discount

        - createIndex:
            schemaName: promotion
            tableName: discount_conditions
            indexName: idx_discount_conditions_discount_group
            columns:
              - column:
                  name: discount_id
              - column:
                  name: condition_group

        - createIndex:
            schemaName: promotion
            tableName: discount_conditions
            indexName: idx_discount_conditions_type
            columns:
              - column:
                  name: type
