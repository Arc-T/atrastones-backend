databaseChangeLog:
  - changeSet:
      id: 1771144484695-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: promotion
            tableName: discount_types
            remarks: Defines how discounts are calculated
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    nullable: false

              - column:
                  name: code
                  type: ${short_text.type}
                  remarks: UNIT, PERCENT, FIXED, BUY_X_GET_Y
                  constraints:
                    nullable: false

              - column:
                  name: name
                  type: ${short_text.type}
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: ${short_text.type}
                  constraints:
                    nullable: true

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addPrimaryKey:
            schemaName: promotion
            tableName: discount_types
            columnNames: id
            constraintName: pk_discount_types

        - addUniqueConstraint:
            constraintName: uk_discount_types_code
            schemaName: promotion
            tableName: discount_types
            columnNames: code
