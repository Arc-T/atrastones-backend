databaseChangeLog:
  - changeSet:
      id: 1771140436351-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: promotion
            tableName: discounts
            remarks: Discount rules and configuration
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    nullable: false

              - column:
                  name: name
                  type: ${short_text.type}
                  remarks: Discount display name
                  constraints:
                    nullable: false

              - column:
                  name: discountable_type
                  type: ${short_text.type}
                  remarks: like coupons
                  constraints:
                    nullable: false

              - column:
                  name: discount_type_id
                  type: ${id.type}
                  remarks: References discount_types.id
                  constraints:
                    nullable: false

              - column:
                  name: discount_scope_id
                  type: ${id.type}
                  remarks: References discount_scopes.id
                  constraints:
                    nullable: false

              - column:
                  name: amount
                  type: ${price.type}
                  remarks: Discount amount or percentage (positive number)
                  constraints:
                    nullable: false

              - column:
                  name: selection_type
                  # type: ENUM('ALL', 'INCLUDED', 'EXCLUDED')
                  type: VARCHAR(500)
                  defaultValue: ALL
                  constraints:
                    nullable: false

              - column:
                  name: start_date
                  type: ${timestamp_value.type}
                  constraints:
                    nullable: false

              - column:
                  name: expire_date
                  type: ${timestamp_value.type}
                  constraints:
                    nullable: true

              - column:
                  name: max_uses
                  type: ${integer_value.type}
                  remarks: Global usage limit
                  constraints:
                    nullable: true

              - column:
                  name: used_count
                  type: ${integer_value.type}
                  defaultValue: 0
                  remarks: Track actual usage
                  constraints:
                    nullable: false

              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValue: true
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: ${short_text.type}
                  constraints:
                    nullable: true

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: ${timestamp_value.type}
                  constraints:
                    nullable: true

              - column:
                  name: deleted_at
                  type: ${timestamp_value.type}
                  constraints:
                    nullable: true

        - addPrimaryKey:
            schemaName: promotion
            tableName: discounts
            columnNames: id
            constraintName: pk_discounts

        - addForeignKeyConstraint:
            baseTableSchemaName: promotion
            baseTableName: discounts
            baseColumnNames: discount_type_id
            referencedTableSchemaName: promotion
            referencedTableName: discount_types
            referencedColumnNames: id
            constraintName: fk_discounts_discount_type

        - addForeignKeyConstraint:
            baseTableSchemaName: promotion
            baseTableName: discounts
            baseColumnNames: discount_scope_id
            referencedTableSchemaName: promotion
            referencedTableName: discount_scopes
            referencedColumnNames: id
            constraintName: fk_discounts_discount_scope

        - createIndex:
            schemaName: promotion
            indexName: idx_discounts_active_dates
            tableName: discounts
            columns:
              - column:
                  name: is_active
              - column:
                  name: start_date
              - column:
                  name: expire_date

        - createIndex:
            schemaName: promotion
            indexName: idx_discounts_type_scope
            tableName: discounts
            columns:
              - column:
                  name: discount_type_id
              - column:
                  name: discount_scope_id

        - createIndex:
            schemaName: promotion
            indexName: idx_discounts_deleted_at
            tableName: discounts
            columns:
              - column:
                  name: deleted_at
