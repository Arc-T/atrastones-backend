databaseChangeLog:
  - changeSet:
      id: 1771140436351-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: promotion
            tableName: discounts
            remarks: Discount rules and configuration
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: ${short_text.type}
                  constraints:
                    nullable: false
                  remarks: Discount display name

              - column:
                  name: discountable_type
                  type: ${short_text.type}
                  constraints:
                    nullable: false
                  remarks: like coupons

              - column:
                  name: discount_type_id
                  type: ${id.type}
                  constraints:
                    nullable: false
                    foreignKeyName: fk_discounts_discount_type
                    references: discount_types(id)
                  remarks: References discount_types.id

              - column:
                  name: discount_scope_id
                  type: ${id.type}
                  constraints:
                    nullable: false
                    foreignKeyName: fk_discounts_discount_scope
                    references: discount_scopes(id)
                  remarks: References discount_scopes.id

              - column:
                  name: amount
                  type: ${price.type}
                  constraints:
                    nullable: false
                  remarks: Discount amount or percentage (positive number)

              - column:
                  name: selection_type
                  #                  type: ENUM('ALL', 'INCLUDED', 'EXCLUDED')
                  type: VARCHAR(500)
                  defaultValue: ALL
                  constraints:
                    nullable: false

              - column:
                  name: start_date
                  type: ${timestamp_value.type}
                  constraints:
                    nullable: false

              - column:
                  name: expire_date
                  type: ${timestamp_value.type}
                  constraints:
                    nullable: true

              - column:
                  name: max_uses
                  type: ${integer_value.type}
                  constraints:
                    nullable: true
                  remarks: Global usage limit

              - column:
                  name: used_count
                  type: ${integer_value.type}
                  defaultValue: 0
                  constraints:
                    nullable: false
                  remarks: Track actual usage

              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValue: true
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: ${short_text.type}
                  constraints:
                    nullable: true

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: ${timestamp_value.type}
                  constraints:
                    nullable: true

              - column:
                  name: deleted_at
                  type: ${timestamp_value.type}
                  constraints:
                    nullable: true

        - createIndex:
            schemaName: promotion
            indexName: idx_discounts_active_dates
            tableName: discounts
            columns:
              - column:
                  name: is_active
              - column:
                  name: start_date
              - column:
                  name: expire_date

        - createIndex:
            schemaName: promotion
            indexName: idx_discounts_type_scope
            tableName: discounts
            columns:
              - column:
                  name: discount_type_id
              - column:
                  name: discount_scope_id