databaseChangeLog:
  - changeSet:
      id: 1767965092343-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: promotion
            tableName: discount_targets
            remarks: Entities that discounts apply to (products, categories, customers, etc.)
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    nullable: false

              - column:
                  name: discount_id
                  type: ${id.type}
                  constraints:
                    nullable: false

              - column:
                  name: target_type
                  # type: ENUM('PRODUCT', 'CATEGORY', 'COLLECTION', 'TAG', 'CUSTOMER', 'CUSTOMER_SEGMENT', 'DELIVERY_METHOD')
                  type: VARCHAR(500)
                  constraints:
                    nullable: false

              - column:
                  name: target_id
                  type: ${id.type}
                  remarks: ID in the respective entity table
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addPrimaryKey:
            schemaName: promotion
            tableName: discount_targets
            columnNames: id
            constraintName: pk_discount_targets

        - addForeignKeyConstraint:
            baseTableSchemaName: promotion
            baseTableName: discount_targets
            baseColumnNames: discount_id
            referencedTableSchemaName: promotion
            referencedTableName: discounts
            referencedColumnNames: id
            constraintName: fk_discount_targets_discount

        - addUniqueConstraint:
            constraintName: uk_discount_targets
            schemaName: promotion
            tableName: discount_targets
            columnNames: discount_id, target_type, target_id

        - createIndex:
            schemaName: promotion
            indexName: idx_discount_targets_discount
            tableName: discount_targets
            columns:
              - column:
                  name: discount_id

        - createIndex:
            schemaName: promotion
            indexName: idx_discount_targets_entity
            tableName: discount_targets
            columns:
              - column:
                  name: target_type
              - column:
                  name: target_id
