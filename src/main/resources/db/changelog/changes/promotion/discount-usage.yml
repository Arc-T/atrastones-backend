databaseChangeLog:
  - changeSet:
      id: 1767965092344-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: promotion
            tableName: discount_usage
            remarks: Discount application tracking - all amounts in Iranian Tomans
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    nullable: false

              - column:
                  name: discountable_type
                  type: ${short_text.type}
                  constraints:
                    nullable: false

              - column:
                  name: discountable_id
                  type: ${id.type}
                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: ${id.type}
                  constraints:
                    nullable: false

              - column:
                  name: order_id
                  type: ${id.type}
                  constraints:
                    nullable: false

              - column:
                  name: order_amount_before
                  type: ${price.type}
                  remarks: Amount before discount (Tomans)
                  constraints:
                    nullable: false

              - column:
                  name: discount_amount
                  type: ${price.type}
                  remarks: Discount amount applied (Tomans)
                  constraints:
                    nullable: false

              - column:
                  name: order_amount_after
                  type: ${price.type}
                  remarks: Final order amount (Tomans)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addPrimaryKey:
            schemaName: promotion
            tableName: discount_usage
            columnNames: id
            constraintName: pk_discount_usage

        - addForeignKeyConstraint:
            baseTableSchemaName: promotion
            baseTableName: discount_usage
            baseColumnNames: user_id
            referencedTableSchemaName: identity
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_discount_usage_user

        - addForeignKeyConstraint:
            baseTableSchemaName: promotion
            baseTableName: discount_usage
            baseColumnNames: order_id
            referencedTableName: orders
            referencedTableSchemaName: ordering
            referencedColumnNames: id
            constraintName: fk_discount_usage_order

        - createIndex:
            schemaName: promotion
            indexName: idx_discount_usage_discount_customer
            tableName: discount_usage
            columns:
              - column:
                  name: user_id

        - createIndex:
            schemaName: promotion
            indexName: idx_discount_usage_order
            tableName: discount_usage
            columns:
              - column:
                  name: order_id

        - createIndex:
            schemaName: promotion
            indexName: idx_discount_usage_created_at
            tableName: discount_usage
            columns:
              - column:
                  name: created_at

        - createIndex:
            schemaName: promotion
            indexName: idx_discount_usage_amount
            tableName: discount_usage
            columns:
              - column:
                  name: discount_amount
