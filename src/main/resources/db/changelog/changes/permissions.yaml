databaseChangeLog:
  - changeSet:
      id: 1767965016970-1
      author: Mr.Arc-T
      changes:
        - createTable:
            tableName: permissions
            remarks: Stores permissions for RBAC
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: ${name.type}
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: description
                  type: ${short_text.type}
                  constraints:
                    nullable: true
                  remarks: Permission description

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: ${timestamp_value.type}
                  constraints:
                    nullable: true