databaseChangeLog:
  - changeSet:
      id: 1767965131634-1
      author: Mr.Arc-T
      changes:
        - createTable:
            tableName: attributes
            remarks: Stores product attributes
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: ${name.type}
                  constraints:
                    nullable: false
                  remarks: Supports Persian names

              - column:
                  name: category_id
                  type: ${integer_value.type}
                  constraints:
                    nullable: false
                    foreignKeyName: fk_attributes_category
                    references: categories(id)
                    deleteCascade: true

              - column:
                  name: type
                  type: VARCHAR(500)
                  #                  type: ENUM('TEXT', 'NUMBER', 'SELECT', 'MULTISELECT')
                  defaultValue: TEXT
                  constraints:
                    nullable: false

              - column:
                  name: is_filterable
                  type: ${boolean_flag.type}
                  defaultValue: 'false'
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: ${timestamp_value.type}
                  constraints:
                    nullable: true

        - createIndex:
            tableName: attributes
            indexName: idx_attributes_category
            columns:
              - column:
                  name: category_id

        - createIndex:
            tableName: attributes
            indexName: idx_attributes_filterable
            columns:
              - column:
                  name: is_filterable