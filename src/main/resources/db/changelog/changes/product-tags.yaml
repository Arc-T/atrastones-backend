databaseChangeLog:
  - changeSet:
      id: 1767965207884-1
      author: Mr.Arc-T
      changes:
        - createTable:
            tableName: product_tags
            remarks: Maps products to tags
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: product_id
                  type: ${integer_value.type}
                  constraints:
                    nullable: false
                    foreignKeyName: fk_product_tags_product
                    references: products(id)

              - column:
                  name: tag_id
                  type: ${integer_value.type}
                  constraints:
                    nullable: false
                    foreignKeyName: fk_product_tags_tag
                    references: tags(id)
                    deleteCascade: true

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            tableName: product_tags
            indexName: idx_product_tags_product
            columns:
              - column:
                  name: product_id

        - createIndex:
            tableName: product_tags
            indexName: idx_product_tags_tag
            columns:
              - column:
                  name: tag_id

        - createIndex:
            unique: true
            tableName: product_tags
            indexName: idx_product_tags_unique
            columns:
              - column:
                  name: tag_id
              - column:
                  name: product_id