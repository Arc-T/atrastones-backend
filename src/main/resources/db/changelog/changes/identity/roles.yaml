databaseChangeLog:
  - changeSet:
      id: 1767965009054-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: identity
            tableName: roles
            remarks: Stores user roles for RBAC
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: ${name.type}
                  constraints:
                    unique: true
                    nullable: false

              - column:
                  name: description
                  type: ${short_text.type}
                  constraints:
                    nullable: true
                  remarks: Role description for clarity

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: ${timestamp_value.type}
                  constraints:
                    nullable: true