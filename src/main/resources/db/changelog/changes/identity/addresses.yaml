databaseChangeLog:
  - changeSet:
      id: 1767965092337-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: identity
            tableName: addresses
            remarks: Stores user addresses
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_id
                  type: ${integer_value.type}
                  constraints:
                    nullable: false
                    foreignKeyName: fk_addresses_user
                    references: users(id)

              - column:
                  name: address_type
                  #                  type: ENUM('HOME', 'WORK', 'OTHER')
                  type: VARCHAR(500)
                  constraints:
                    nullable: false

              - column:
                  name: province_id
                  type: ${integer_value.type}
                  constraints:
                    nullable: false
                    foreignKeyName: fk_addresses_province
                    references: provinces(id)

              - column:
                  name: address_line
                  type: ${short_text.type}
                  constraints:
                    nullable: false

              - column:
                  name: postal_code
                  type: ${short_text.type}
                  constraints:
                    nullable: true
                  remarks: postal code (10 digits)

              - column:
                  name: latitude
                  type: ${gps.type}
                  constraints:
                    nullable: true

              - column:
                  name: longitude
                  type: ${gps.type}
                  constraints:
                    nullable: true

              - column:
                  name: description
                  type: ${short_text.type}
                  constraints:
                    nullable: true

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: ${timestamp_value.type}
                  constraints:
                    nullable: true

        - createIndex:
            schemaName: identity
            indexName: idx_addresses_user
            tableName: addresses
            columns:
              - column:
                  name: user_id

        - createIndex:
            schemaName: identity
            indexName: idx_addresses_province
            tableName: addresses
            columns:
              - column:
                  name: province_id
