databaseChangeLog:
  - changeSet:
      id: 1767965097885-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: identity
            tableName: user_logs
            remarks: Logs user activities
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: ${integer_value.type}
                  constraints:
                    nullable: false

              - column:
                  name: action_type
                  type: ${name.type}
                  remarks: e.g., LOGIN, PURCHASE
                  constraints:
                    nullable: false

              - column:
                  name: action_id
                  type: ${name.type}
                  remarks: Reference to entity (e.g., order ID)
                  constraints:
                    nullable: false

              - column:
                  name: ip_address
                  type: ${short_text.type}
                  remarks: Supports IPv4/IPv6
                  constraints:
                    nullable: false

              - column:
                  name: user_agent
                  type: ${short_text.type}
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: ${short_text.type}
                  constraints:
                    nullable: true

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addPrimaryKey:
            schemaName: identity
            tableName: user_logs
            columnNames: id
            constraintName: pk_user_logs

        - addForeignKeyConstraint:
            baseTableSchemaName: identity
            baseTableName: user_logs
            baseColumnNames: user_id
            referencedTableSchemaName: identity
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_logs_user

        - createIndex:
            schemaName: identity
            tableName: user_logs
            indexName: idx_logs_user
            columns:
              - column:
                  name: user_id
              - column:
                  name: created_at

        - createIndex:
            schemaName: identity
            tableName: user_logs
            indexName: idx_logs_action_type
            columns:
              - column:
                  name: action_type
