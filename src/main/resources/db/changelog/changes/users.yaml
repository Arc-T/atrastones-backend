databaseChangeLog:
  - changeSet:
      id: 1767965051458-1
      author: Mr.Arc-T
      changes:
        - createTable:
            tableName: users
            remarks: Stores user information
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: first_name
                  type: ${name.type}
                  constraints:
                    nullable: false

              - column:
                  name: last_name
                  type: ${name.type}
                  constraints:
                    nullable: false

              - column:
                  name: email
                  type: ${short_text.type}
                  constraints:
                    nullable: true
                    unique: true

              - column:
                  name: phone
                  type: ${phone.type}
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: password
                  type: ${short_text.type}
                  constraints:
                    nullable: false
                  remarks: Hashed password (e.g., bcrypt)

              - column:
                  name: user_group_id
                  type: ${integer_value.type}
                  constraints:
                    nullable: false
                    foreignKeyName: fk_users_user_group
                    references: user_groups(id)

              - column:
                  name: gender
                  type: VARCHAR(500)
                  #                  type: ENUM('MALE', 'FEMALE')
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: VARCHAR(500)
                  constraints:
                    nullable: true

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: ${timestamp_value.type}
                  constraints:
                    nullable: true

              - column:
                  name: deleted_at
                  type: ${timestamp_value.type}
                  constraints:
                    nullable: true

        - createIndex:
            tableName: users
            indexName: idx_users_email
            columns:
              - column:
                  name: email

        - createIndex:
            tableName: users
            indexName: idx_users_phone
            columns:
              - column:
                  name: phone

        - createIndex:
            tableName: users
            indexName: idx_users_group
            columns:
              - column:
                  name: user_group_id