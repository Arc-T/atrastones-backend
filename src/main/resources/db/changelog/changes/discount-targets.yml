databaseChangeLog:
  - changeSet:
      id: 1767965092343-1
      author: Mr.Arc-T
      changes:
        - createTable:
            tableName: discount_targets
            remarks: Entities that discounts apply to (products, categories, customers, etc.)
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: discount_id
                  type: ${id.type}
                  constraints:
                    nullable: false
                    foreignKeyName: fk_discount_targets_discount
                    references: discounts(id)

              - column:
                  name: target_type
                  #                  type: ENUM('PRODUCT', 'CATEGORY', 'COLLECTION', 'TAG', 'CUSTOMER', 'CUSTOMER_SEGMENT', 'DELIVERY_METHOD')
                  type: VARCHAR(500)
                  constraints:
                    nullable: false

              - column:
                  name: target_id
                  type: ${id.type}
                  constraints:
                    nullable: false
                  remarks: ID in the respective entity table

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            constraintName: uk_discount_targets
            tableName: discount_targets
            columnNames: discount_id, target_type, target_id

        - createIndex:
            indexName: idx_discount_targets_discount
            tableName: discount_targets
            columns:
              - column:
                  name: discount_id

        - createIndex:
            indexName: idx_discount_targets_entity
            tableName: discount_targets
            columns:
              - column:
                  name: target_type
              - column:
                  name: target_id