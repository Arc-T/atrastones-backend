databaseChangeLog:
  - changeSet:
      id: 1767965126361-1
      author: Mr.Arc-T
      changes:
        - createTable:
            tableName: categories
            remarks: Stores product categories
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: ${name.type}
                  constraints:
                    nullable: false

              - column:
                  name: url
                  type: ${short_text.type}
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: icon
                  type: ${name.type}
                  constraints:
                    nullable: true

              - column:
                  name: parent_id
                  type: ${integer_value.type}
                  constraints:
                    nullable: true
                    foreignKeyName: fk_categories_parent
                    references: categories(id)
                    deleteCascade: true

              - column:
                  name: display_order
                  type: ${integer_value.type}
                  defaultValue: '0'
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: ${short_text.type}
                  constraints:
                    nullable: true

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: ${timestamp_value.type}
                  constraints:
                    nullable: true

        - createIndex:
            tableName: categories
            indexName: idx_categories_parent
            columns:
              - column:
                  name: parent_id

        - createIndex:
            tableName: categories
            indexName: idx_categories_url
            columns:
              - column:
                  name: url