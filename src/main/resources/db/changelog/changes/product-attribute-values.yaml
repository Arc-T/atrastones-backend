databaseChangeLog:
  - changeSet:
      id: 1767965215846-1
      author: Mr.Arc-T
      changes:
        - createTable:
            tableName: product_attribute_values
            remarks: Maps products to attribute values
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: product_id
                  type: ${integer_value.type}
                  constraints:
                    nullable: false
                    foreignKeyName: fk_product_attr_values_product
                    references: products(id)
                    deleteCascade: true

              - column:
                  name: attribute_id
                  type: ${integer_value.type}
                  constraints:
                    nullable: false
                    foreignKeyName: fk_product_attr_values_attribute
                    references: attributes(id)
                    deleteCascade: true

              - column:
                  name: attribute_value_id
                  type: ${integer_value.type}
                  constraints:
                    nullable: false
                    foreignKeyName: fk_product_attr_values_value
                    references: attribute_values(id)
                    deleteCascade: true

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            tableName: product_attribute_values
            indexName: idx_product_attribute_values_product
            columns:
              - column:
                  name: product_id

        - createIndex:
            tableName: product_attribute_values
            indexName: idx_product_attribute_values_attribute
            columns:
              - column:
                  name: attribute_id

        - createIndex:
            unique: true
            tableName: product_attribute_values
            indexName: idx_product_attribute_values_unique
            columns:
              - column:
                  name: product_id
              - column:
                  name: attribute_id
              - column:
                  name: attribute_value_id