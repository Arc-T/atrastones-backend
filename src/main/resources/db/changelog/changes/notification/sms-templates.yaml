databaseChangeLog:
  - changeSet:
      id: 1767965268431-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: notification
            tableName: sms_templates
            remarks: Stores SMS templates
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: ${short_text.type}
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: message
                  type: ${long_text.type}
                  constraints:
                    nullable: false
                  remarks: Supports Persian messages

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: ${timestamp_value.type}
                  constraints:
                    nullable: true