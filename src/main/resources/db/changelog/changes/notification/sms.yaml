databaseChangeLog:
  - changeSet:
      id: 1767965277357-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: notification
            tableName: sms
            remarks: Stores sent SMS messages
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: phone
                  type: ${phone.type}
                  constraints:
                    nullable: false
                  remarks: Persian phone number

              - column:
                  name: status_id
                  type: ${integer_value.type}
                  constraints:
                    nullable: false
                    foreignKeyName: fk_sms_status
                    references: sms_statuses(id)

              - column:
                  name: template_id
                  type: ${integer_value.type}
                  constraints:
                    nullable: true
                    foreignKeyName: fk_sms_template
                    references: sms_templates(id)

              - column:
                  name: text
                  type: ${long_text.type}
                  constraints:
                    nullable: false
                  remarks: Supports Persian text

              - column:
                  name: response
                  type: ${short_text.type}
                  constraints:
                    nullable: true

              - column:
                  name: description
                  type: VARCHAR(500)
                  constraints:
                    nullable: true

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: ${timestamp_value.type}
                  constraints:
                    nullable: true

        - createIndex:
            schemaName: notification
            tableName: sms
            indexName: idx_sms_phone
            columns:
              - column:
                  name: phone

        - createIndex:
            schemaName: notification
            tableName: sms
            indexName: idx_sms_status
            columns:
              - column:
                  name: status_id

        - createIndex:
            schemaName: notification
            tableName: sms
            indexName: idx_sms_template
            columns:
              - column:
                  name: template_id