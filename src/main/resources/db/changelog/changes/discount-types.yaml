databaseChangeLog:
  - changeSet:
      id: 1771144484695-1
      author: Mr.Arc-T
      changes:
        - createTable:
            tableName: discount_types
            remarks: Defines how discounts are calculated
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: code
                  type: ${short_text.type}
                  constraints:
                    nullable: false
                  remarks: UNIT, PERCENT, FIXED, BUY_X_GET_Y

              - column:
                  name: name
                  type: ${short_text.type}
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: ${short_text.type}
                  constraints:
                    nullable: true

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            constraintName: uk_discount_types_code
            tableName: discount_types
            columnNames: code