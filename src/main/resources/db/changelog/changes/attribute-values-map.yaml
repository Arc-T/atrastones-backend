databaseChangeLog:
  - changeSet:
      id: 1767965142461-1
      author: Mr.Arc-T
      changes:
        - createTable:
            tableName: attribute_values_map
            remarks: Maps attributes to their possible values
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: attribute_id
                  type: ${integer_value.type}
                  constraints:
                    nullable: false
                    foreignKeyName: fk_attr_values_map_attribute
                    references: attributes(id)
                    deleteCascade: true

              - column:
                  name: attribute_value_id
                  type: ${integer_value.type}
                  constraints:
                    nullable: false
                    foreignKeyName: fk_attr_values_map_value
                    references: attribute_values(id)
                    deleteCascade: true

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            tableName: attribute_values_map
            indexName: idx_attribute_values_map_attribute
            columns:
              - column:
                  name: attribute_id

        - createIndex:
            tableName: attribute_values_map
            indexName: idx_attribute_values_map_value
            columns:
              - column:
                  name: attribute_value_id

        - createIndex:
            unique: true
            tableName: attribute_values_map
            indexName: idx_attribute_values_map_unique
            columns:
              - column:
                  name: attribute_id
              - column:
                  name: attribute_value_id
