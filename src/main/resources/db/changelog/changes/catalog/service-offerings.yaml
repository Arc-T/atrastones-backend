databaseChangeLog:
  - changeSet:
      id: 1767965159792-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: catalog
            tableName: service_offerings
            remarks: Stores service-specific information for catalog items.
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  constraints:
                    nullable: false

              - column:
                  name: name
                  type: ${name.type}
                  remarks: Supports Persian names.
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: ${short_text.type}
                  constraints:
                    nullable: true

        - addPrimaryKey:
            schemaName: catalog
            tableName: service_offerings
            columnNames: id
            constraintName: pk_service_offerings