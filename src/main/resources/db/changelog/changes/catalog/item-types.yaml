databaseChangeLog:
  - changeSet:
      id: 1784121678785-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: catalog
            tableName: item_types
            remarks: Stores catalog item types that are purchasable.
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    nullable: false

              - column:
                  name: catalog_item_type
                  type: ${short_text.type}
                  remarks: name of the item.
                  constraints:
                    nullable: false

        - addPrimaryKey:
            schemaName: catalog
            tableName: item_types
            columnNames: id
            constraintName: pk_item_types