databaseChangeLog:
  - changeSet:
      id: 1767965126361-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: catalog
            tableName: categories
            remarks: Stores categories for catalog items.
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    nullable: false

              - column:
                  name: name
                  type: ${name.type}
                  constraints:
                    nullable: false

              - column:
                  name: slug
                  type: ${short_text.type}
                  constraints:
                    nullable: false

              - column:
                  name: icon
                  type: ${name.type}
                  constraints:
                    nullable: true

              - column:
                  name: parent_id
                  type: ${id.type}
                  constraints:
                    nullable: true

              - column:
                  name: display_order
                  type: ${integer_value.type}
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: ${short_text.type}
                  constraints:
                    nullable: true

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: ${timestamp_value.type}
                  constraints:
                    nullable: true

        - addPrimaryKey:
            schemaName: catalog
            tableName: categories
            columnNames: id
            constraintName: pk_categories

        - addUniqueConstraint:
            schemaName: catalog
            tableName: categories
            columnNames: slug
            constraintName: uk_categories_slug

        - addForeignKeyConstraint:
            baseTableSchemaName: catalog
            baseTableName: categories
            baseColumnNames: parent_id
            referencedTableSchemaName: catalog
            referencedTableName: categories
            referencedColumnNames: id
            constraintName: fk_categories_parent
            onDelete: CASCADE

        - createIndex:
            schemaName: catalog
            tableName: categories
            indexName: idx_categories_parent
            columns:
              - column:
                  name: parent_id

        - createIndex:
            schemaName: catalog
            tableName: categories
            indexName: idx_categories_slug
            columns:
              - column:
                  name: slug