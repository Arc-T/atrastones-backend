databaseChangeLog:
  - changeSet:
      id: 1784121736755-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: catalog
            tableName: categories
            remarks: Stores hierarchical categories for catalog items
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    nullable: false

              - column:
                  name: item_type_id
                  type: ${id.type}
                  constraints:
                    nullable: false

              - column:
                  name: parent_id
                  type: ${id.type}
                  constraints:
                    nullable: true

              - column:
                  name: name
                  type: ${name.type}
                  constraints:
                    nullable: false

              - column:
                  name: slug
                  type: ${name.type}
                  constraints:
                    nullable: false

              - column:
                  name: icon
                  type: ${name.type}
                  constraints:
                    nullable: true

              - column:
                  name: display_order
                  type: ${small_integer.type}
                  defaultValueNumeric: '0'
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: ${long_text.type}
                  constraints:
                    nullable: true

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: ${timestamp_value.type}
                  constraints:
                    nullable: true

        - addPrimaryKey:
            schemaName: catalog
            tableName: categories
            columnNames: id
            constraintName: pk_categories

        - addUniqueConstraint:
            schemaName: catalog
            tableName: categories
            columnNames: slug
            constraintName: uk_categories_slug

        - addForeignKeyConstraint:
            baseTableSchemaName: catalog
            baseTableName: categories
            baseColumnNames: item_type_id
            referencedTableSchemaName: catalog
            referencedTableName: item_types
            referencedColumnNames: id
            constraintName: fk_categories_item_type

        - addForeignKeyConstraint:
            baseTableSchemaName: catalog
            baseTableName: categories
            baseColumnNames: parent_id
            referencedTableSchemaName: catalog
            referencedTableName: categories
            referencedColumnNames: id
            constraintName: fk_categories_parent

        - createIndex:
            schemaName: catalog
            tableName: categories
            indexName: idx_categories_item_type
            columns:
              - column:
                  name: item_type_id

        - createIndex:
            schemaName: catalog
            tableName: categories
            indexName: idx_categories_parent
            columns:
              - column:
                  name: parent_id

        - createIndex:
            schemaName: catalog
            tableName: categories
            indexName: idx_categories_slug
            columns:
              - column:
                  name: slug

        - createIndex:
            schemaName: catalog
            tableName: categories
            indexName: idx_categories_display_order
            columns:
              - column:
                  name: display_order