databaseChangeLog:
  - changeSet:
      id: 1767970000003-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: catalog
            tableName: variant_prices
            remarks: Stores historical prices for service offers and products
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    nullable: false

              - column:
                  name: base_price
                  type: ${price.type}
                  remarks: Base price in Toman
                  constraints:
                    nullable: false

              - column:
                  name: is_active
                  type: ${boolean.type}
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addPrimaryKey:
            schemaName: catalog
            tableName: prices
            columnNames: id
            constraintName: pk_prices

        - addForeignKeyConstraint:
            baseTableSchemaName: catalog
            baseTableName: prices
            baseColumnNames: product_variant_id
            referencedTableSchemaName: catalog
            referencedTableName: product_variants
            referencedColumnNames: id
            constraintName: fk_prices_product_variant

        - createIndex:
            schemaName: catalog
            tableName: prices
            indexName: idx_prices_product_variant
            columns:
              - column:
                  name: product_variant_id

        - createIndex:
            schemaName: catalog
            tableName: prices
            indexName: idx_prices_active
            columns:
              - column:
                  name: is_active

        - createIndex:
            schemaName: catalog
            tableName: prices
            indexName: idx_prices_created_at
            columns:
              - column:
                  name: created_at