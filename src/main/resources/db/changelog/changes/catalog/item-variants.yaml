databaseChangeLog:
  - changeSet:
      id: 1783792605596-4
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: catalog
            tableName: item_variants
            remarks: Stores purchasable variants of catalog items
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    nullable: false

              - column:
                  name: item_id
                  type: ${id.type}
                  constraints:
                    nullable: false

              - column:
                  name: item_variant_price_id
                  type: ${id.type}
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: ${name.type}
                  remarks: Item variant status enum
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: ${timestamp_value.type}
                  constraints:
                    nullable: true

              - column:
                  name: deleted_at
                  type: ${timestamp_value.type}
                  constraints:
                    nullable: true

        - addPrimaryKey:
            schemaName: catalog
            tableName: item_variants
            columnNames: id
            constraintName: pk_item_variants

        - addForeignKeyConstraint:
            baseTableSchemaName: catalog
            baseTableName: item_variants
            baseColumnNames: item_id
            referencedTableSchemaName: catalog
            referencedTableName: items
            referencedColumnNames: id
            constraintName: fk_item_variants_item

        - addForeignKeyConstraint:
            baseTableSchemaName: catalog
            baseTableName: item_variants
            baseColumnNames: item_variant_price_id
            referencedTableSchemaName: catalog
            referencedTableName: item_variant_prices
            referencedColumnNames: id
            constraintName: fk_item_variants_price

        - addUniqueConstraint:
            schemaName: catalog
            tableName: item_variants
            columnNames: item_variant_price_id
            constraintName: uk_item_variants_price

        - createIndex:
            schemaName: catalog
            tableName: item_variants
            indexName: idx_item_variants_item
            columns:
              - column:
                  name: item_id

        - createIndex:
            schemaName: catalog
            tableName: item_variants
            indexName: idx_item_variants_status
            columns:
              - column:
                  name: status

        - createIndex:
            schemaName: catalog
            tableName: item_variants
            indexName: idx_item_variants_deleted_at
            columns:
              - column:
                  name: deleted_at