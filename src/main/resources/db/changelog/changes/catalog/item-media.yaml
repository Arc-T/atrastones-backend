databaseChangeLog:
  - changeSet:
      id: 1767965225839-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: catalog
            tableName: item_media
            remarks: Stores media files associated with catalog items.
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    nullable: false

              - column:
                  name: item_id
                  type: ${id.type}
                  constraints:
                    nullable: false

              - column:
                  name: media_type_id
                  type: ${id.type}
                  constraints:
                    nullable: false

              - column:
                  name: slug
                  type: ${short_text.type}
                  remarks: Unique media identifier or storage path.
                  constraints:
                    nullable: false

              - column:
                  name: name
                  type: ${short_text.type}
                  remarks: Original file name.
                  constraints:
                    nullable: false

              - column:
                  name: mime_type
                  type: ${short_text.type}
                  remarks: MIME type of the media file.
                  constraints:
                    nullable: false

              - column:
                  name: display_order
                  type: ${integer_value.type}
                  defaultValueNumeric: 1
                  remarks: Starts at 1; the first media is the primary media.
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addPrimaryKey:
            schemaName: catalog
            tableName: item_media
            columnNames: id
            constraintName: pk_item_media

        - addForeignKeyConstraint:
            baseTableSchemaName: catalog
            baseTableName: item_media
            baseColumnNames: item_id
            referencedTableSchemaName: catalog
            referencedTableName: items
            referencedColumnNames: id
            constraintName: fk_item_media_item
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableSchemaName: catalog
            baseTableName: item_media
            baseColumnNames: media_type_id
            referencedTableSchemaName: catalog
            referencedTableName: media_types
            referencedColumnNames: id
            constraintName: fk_item_media_media_type

        - addUniqueConstraint:
            schemaName: catalog
            tableName: item_media
            columnNames: slug
            constraintName: uk_item_media_slug

        - createIndex:
            schemaName: catalog
            tableName: item_media
            indexName: idx_item_media_item
            columns:
              - column:
                  name: item_id

        - createIndex:
            schemaName: catalog
            tableName: item_media
            indexName: idx_item_media_media_type
            columns:
              - column:
                  name: media_type_id

        - createIndex:
            schemaName: catalog
            tableName: item_media
            indexName: idx_item_media_slug
            columns:
              - column:
                  name: slug