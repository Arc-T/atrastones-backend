databaseChangeLog:
  - changeSet:
      id: 1767965215846-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: catalog
            tableName: product_attribute_values
            remarks: Maps catalog products to their attribute values.
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    nullable: false

              - column:
                  name: product_id
                  type: ${id.type}
                  constraints:
                    nullable: false

              - column:
                  name: attribute_id
                  type: ${id.type}
                  constraints:
                    nullable: false

              - column:
                  name: attribute_value_id
                  type: ${id.type}
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addPrimaryKey:
            schemaName: catalog
            tableName: product_attribute_values
            columnNames: id
            constraintName: pk_product_attribute_values

        - addForeignKeyConstraint:
            baseTableSchemaName: catalog
            baseTableName: product_attribute_values
            baseColumnNames: product_id
            referencedTableSchemaName: catalog
            referencedTableName: products
            referencedColumnNames: id
            constraintName: fk_product_attribute_values_product
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableSchemaName: catalog
            baseTableName: product_attribute_values
            baseColumnNames: attribute_id
            referencedTableSchemaName: catalog
            referencedTableName: attributes
            referencedColumnNames: id
            constraintName: fk_product_attribute_values_attribute
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableSchemaName: catalog
            baseTableName: product_attribute_values
            baseColumnNames: attribute_value_id
            referencedTableSchemaName: catalog
            referencedTableName: attribute_values
            referencedColumnNames: id
            constraintName: fk_product_attribute_values_value
            onDelete: CASCADE

        - addUniqueConstraint:
            schemaName: catalog
            tableName: product_attribute_values
            columnNames: product_id, attribute_id, attribute_value_id
            constraintName: uk_product_attribute_values_product_attribute_value

        - createIndex:
            schemaName: catalog
            tableName: product_attribute_values
            indexName: idx_product_attribute_values_product
            columns:
              - column:
                  name: product_id

        - createIndex:
            schemaName: catalog
            tableName: product_attribute_values
            indexName: idx_product_attribute_values_attribute
            columns:
              - column:
                  name: attribute_id

        - createIndex:
            schemaName: catalog
            tableName: product_attribute_values
            indexName: idx_product_attribute_values_value
            columns:
              - column:
                  name: attribute_value_id