databaseChangeLog:
  - changeSet:
      id: 1767965207884-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: catalog
            tableName: product_tags
            remarks: Maps catalog products to tags.
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    nullable: false

              - column:
                  name: product_id
                  type: ${id.type}
                  constraints:
                    nullable: false

              - column:
                  name: tag_id
                  type: ${id.type}
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addPrimaryKey:
            schemaName: catalog
            tableName: product_tags
            columnNames: id
            constraintName: pk_product_tags

        - addForeignKeyConstraint:
            baseTableSchemaName: catalog
            baseTableName: product_tags
            baseColumnNames: product_id
            referencedTableSchemaName: catalog
            referencedTableName: products
            referencedColumnNames: id
            constraintName: fk_product_tags_product

        - addForeignKeyConstraint:
            baseTableSchemaName: catalog
            baseTableName: product_tags
            baseColumnNames: tag_id
            referencedTableSchemaName: catalog
            referencedTableName: tags
            referencedColumnNames: id
            constraintName: fk_product_tags_tag

        - addUniqueConstraint:
            schemaName: catalog
            tableName: product_tags
            columnNames: product_id, tag_id
            constraintName: uk_product_tags_product_tag

        - createIndex:
            schemaName: catalog
            tableName: product_tags
            indexName: idx_product_tags_product
            columns:
              - column:
                  name: product_id

        - createIndex:
            schemaName: catalog
            tableName: product_tags
            indexName: idx_product_tags_tag
            columns:
              - column:
                  name: tag_id