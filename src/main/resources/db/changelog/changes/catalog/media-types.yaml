databaseChangeLog:
  - changeSet:
      id: 1767965220473-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: catalog
            tableName: media_types
            remarks: Stores catalog media type definitions.
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    nullable: false

              - column:
                  name: name
                  type: ${name.type}
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: ${short_text.type}
                  constraints:
                    nullable: true

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: ${timestamp_value.type}
                  constraints:
                    nullable: true

        - addPrimaryKey:
            schemaName: catalog
            tableName: media_types
            columnNames: id
            constraintName: pk_media_types

        - addUniqueConstraint:
            schemaName: catalog
            tableName: media_types
            columnNames: name
            constraintName: uk_media_types_name