databaseChangeLog:
  - changeSet:
      id: 1767965131634-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: catalog
            tableName: attributes
            remarks: Stores item attributes.
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    nullable: false

              - column:
                  name: name
                  type: ${name.type}
                  remarks: Supports Persian names.
                  constraints:
                    nullable: false

              - column:
                  name: category_id
                  type: ${id.type}
                  constraints:
                    nullable: false

              - column:
                  name: type
                  type: ${short_text.type}
                  remarks: Attribute type (TEXT, NUMBER, SELECT, MULTISELECT).
                  defaultValue: TEXT
                  constraints:
                    nullable: false

              - column:
                  name: is_filterable
                  type: ${boolean_flag.type}
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: ${short_text.type}
                  constraints:
                    nullable: true

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: ${timestamp_value.type}
                  constraints:
                    nullable: true

        - addPrimaryKey:
            schemaName: catalog
            tableName: attributes
            columnNames: id
            constraintName: pk_attributes

        - addForeignKeyConstraint:
            baseTableSchemaName: catalog
            baseTableName: attributes
            baseColumnNames: category_id
            referencedTableSchemaName: catalog
            referencedTableName: categories
            referencedColumnNames: id
            constraintName: fk_attributes_category
            onDelete: CASCADE

        - createIndex:
            schemaName: catalog
            tableName: attributes
            indexName: idx_attributes_category
            columns:
              - column:
                  name: category_id

        - createIndex:
            schemaName: catalog
            tableName: attributes
            indexName: idx_attributes_filterable
            columns:
              - column:
                  name: is_filterable