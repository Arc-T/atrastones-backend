databaseChangeLog:
  - changeSet:
      id: 1784121655558-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: catalog
            tableName: attributes
            remarks: Stores item attributes such as Color, Size, Weight, Brand, etc.
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    nullable: false

              - column:
                  name: category_id
                  type: ${id.type}
                  constraints:
                    nullable: false

              - column:
                  name: item_type_id
                  type: ${id.type}
                  constraints:
                    nullable: false

              - column:
                  name: name
                  type: ${name.type}
                  constraints:
                    nullable: false

              - column:
                  name: filterable
                  type: ${boolean.type}
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

              - column:
                  name: type
                  type: ${name.type}
                  remarks: Attribute type enum
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: ${long_text.type}
                  constraints:
                    nullable: true

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: ${timestamp_value.type}
                  constraints:
                    nullable: true

        - addPrimaryKey:
            schemaName: catalog
            tableName: attributes
            columnNames: id
            constraintName: pk_attributes

        - addForeignKeyConstraint:
            baseTableSchemaName: catalog
            baseTableName: attributes
            baseColumnNames: category_id
            referencedTableSchemaName: catalog
            referencedTableName: categories
            referencedColumnNames: id
            constraintName: fk_attributes_category

        - addForeignKeyConstraint:
            baseTableSchemaName: catalog
            baseTableName: attributes
            baseColumnNames: item_type_id
            referencedTableSchemaName: catalog
            referencedTableName: item_types
            referencedColumnNames: id
            constraintName: fk_attributes_item_type

        - createIndex:
            schemaName: catalog
            tableName: attributes
            indexName: idx_attributes_category
            columns:
              - column:
                  name: category_id

        - createIndex:
            schemaName: catalog
            tableName: attributes
            indexName: idx_attributes_item_type
            columns:
              - column:
                  name: item_type_id

        - createIndex:
            schemaName: catalog
            tableName: attributes
            indexName: idx_attributes_filterable
            columns:
              - column:
                  name: filterable

        - createIndex:
            schemaName: catalog
            tableName: attributes
            indexName: idx_attributes_type
            columns:
              - column:
                  name: type