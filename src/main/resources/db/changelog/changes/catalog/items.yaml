databaseChangeLog:
  - changeSet:
      id: 1783792605596-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: catalog
            tableName: items
            remarks: Stores catalog items including products and services
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    nullable: false

              - column:
                  name: category_id
                  type: ${id.type}
                  constraints:
                    nullable: false

              - column:
                  name: title
                  type: ${name.type}
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: ${long_text.type}
                  constraints:
                    nullable: true

              - column:
                  name: slug
                  type: ${slug.type}
                  constraints:
                    nullable: false

              - column:
                  name: type
                  type: ${name.type}
                  remarks: Item type enum
                  constraints:
                    nullable: false

              - column:
                  name: published
                  type: ${boolean.type}
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

              - column:
                  name: featured
                  type: ${boolean.type}
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: ${timestamp_value.type}
                  constraints:
                    nullable: true

              - column:
                  name: deleted_at
                  type: ${timestamp_value.type}
                  constraints:
                    nullable: true

        - addPrimaryKey:
            schemaName: catalog
            tableName: items
            columnNames: id
            constraintName: pk_items

        - addUniqueConstraint:
            schemaName: catalog
            tableName: items
            columnNames: slug
            constraintName: uk_items_slug

        - addForeignKeyConstraint:
            baseTableSchemaName: catalog
            baseTableName: items
            baseColumnNames: category_id
            referencedTableSchemaName: catalog
            referencedTableName: categories
            referencedColumnNames: id
            constraintName: fk_items_category

        - createIndex:
            schemaName: catalog
            tableName: items
            indexName: idx_items_category
            columns:
              - column:
                  name: category_id

        - createIndex:
            schemaName: catalog
            tableName: items
            indexName: idx_items_slug
            columns:
              - column:
                  name: slug

        - createIndex:
            schemaName: catalog
            tableName: items
            indexName: idx_items_type
            columns:
              - column:
                  name: type

        - createIndex:
            schemaName: catalog
            tableName: items
            indexName: idx_items_published
            columns:
              - column:
                  name: published

        - createIndex:
            schemaName: catalog
            tableName: items
            indexName: idx_items_featured
            columns:
              - column:
                  name: featured

        - createIndex:
            schemaName: catalog
            tableName: items
            indexName: idx_items_deleted_at
            columns:
              - column:
                  name: deleted_at