databaseChangeLog:
  - changeSet:
      id: 1767970000004-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: catalog
            tableName: product_variants
            remarks: Stores purchasable variants of products
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    nullable: false

              - column:
                  name: product_id
                  type: ${id.type}
                  constraints:
                    nullable: false

              - column:
                  name: stock
                  type: ${integer_value.type}
                  defaultValueNumeric: '0'
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: ${name.type}
                  remarks: Product variant status
                  constraints:
                    nullable: false

        - addPrimaryKey:
            schemaName: catalog
            tableName: product_variants
            columnNames: id
            constraintName: pk_product_variants

        - addForeignKeyConstraint:
            baseTableSchemaName: catalog
            baseTableName: product_variants
            baseColumnNames: product_id
            referencedTableSchemaName: catalog
            referencedTableName: products
            referencedColumnNames: id
            constraintName: fk_product_variants_product
            onDelete: CASCADE

        - createIndex:
            schemaName: catalog
            tableName: product_variants
            indexName: idx_product_variants_product
            columns:
              - column:
                  name: product_id

        - createIndex:
            schemaName: catalog
            tableName: product_variants
            indexName: idx_product_variants_status
            columns:
              - column:
                  name: status