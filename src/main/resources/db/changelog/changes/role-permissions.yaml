databaseChangeLog:
  - changeSet:
      id: 1767965031398-1
      author: Mr.Arc-T
      changes:
        - createTable:
            tableName: role_permissions
            remarks: Maps roles to permissions
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: permission_id
                  type: ${integer_value.type}
                  constraints:
                    nullable: false
                    foreignKeyName: fk_role_permission_permission
                    references: permissions(id)
                    deleteCascade: true

              - column:
                  name: role_id
                  type: ${integer_value.type}
                  constraints:
                    nullable: false
                    foreignKeyName: fk_role_permission_role
                    references: roles(id)
                    deleteCascade: true

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            tableName: role_permissions
            indexName: idx_role_permission_perm
            columns:
              - column:
                  name: permission_id

        - createIndex:
            tableName: role_permissions
            indexName: idx_role_permission_role
            columns:
              - column:
                  name: role_id

        - createIndex:
            unique: true
            tableName: role_permissions
            indexName: idx_role_permission_unique
            columns:
              - column:
                  name: role_id
              - column:
                  name: permission_id
