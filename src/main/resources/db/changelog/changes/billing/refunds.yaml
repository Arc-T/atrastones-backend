databaseChangeLog:
  - changeSet:
      id: 1767965270000-1
      author: Mr.Arc-T
      changes:
        - createTable:
            schemaName: billing
            tableName: refunds
            remarks: Stores refund records for payments
            columns:
              - column:
                  name: id
                  type: ${id.type}
                  autoIncrement: true
                  constraints:
                    nullable: false

              - column:
                  name: payment_id
                  type: ${integer_value.type}
                  constraints:
                    nullable: false

              - column:
                  name: amount
                  type: ${integer_value.type}
                  remarks: Refund amount in Toman
                  constraints:
                    nullable: false

              - column:
                  name: reason
                  type: ${long_text.type}
                  constraints:
                    nullable: true

              - column:
                  name: status
                  # type: ENUM('PENDING', 'APPROVED', 'REJECTED', 'COMPLETED')
                  type: VARCHAR(500)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: ${timestamp_value.type}
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addPrimaryKey:
            schemaName: billing
            tableName: refunds
            columnNames: id
            constraintName: pk_refunds

        - addForeignKeyConstraint:
            baseTableSchemaName: billing
            baseTableName: refunds
            baseColumnNames: payment_id
            referencedTableSchemaName: billing
            referencedTableName: payments
            referencedColumnNames: id
            constraintName: fk_refunds_payment

        - createIndex:
            schemaName: billing
            tableName: refunds
            indexName: idx_refunds_payment
            columns:
              - column:
                  name: payment_id

        - createIndex:
            schemaName: billing
            tableName: refunds
            indexName: idx_refunds_status
            columns:
              - column:
                  name: status