spring:
  application:
    name: ASA

  config:
    import: classpath:db/postgresql/postgresql-config.yml, classpath:sms/melipayamak.yml

  main:
    lazy-initialization: true

  threads:
    virtual:
      enabled: true

  mvc:
    static-path-pattern: /media/**
    log-resolved-exception: false

  web:
    locale: fa_IR
    locale-resolver: accept_header
    resources:
      static-locations: file:uploads/
    error:
      whitelabel:
        enabled: true

  messages:
    basename: i18n/messages
    encoding: UTF-8

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 30MB

  jackson:
    default-property-inclusion: NON_NULL

  liquibase:
    enabled: true
    #    drop-first: true
    change-log: classpath:/db/changelog/master.yml
    database-change-log-table: liquibase_changelogs
    database-change-log-lock-table: liquibase_changelog_locks

  datasource:
    name: ${DB.NAME}
    url: ${DB.URL}
    driver-class-name: ${DB.DRIVER}
    username: ${DB.USERNAME}
    password: ${DB.PASSWORD}
    type: org.springframework.jdbc.datasource.DriverManagerDataSource

  jpa:
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        connection:
          autocommit: false
    hibernate:
      ddl-auto: none

  data:
    jpa:
      repositories:
        enabled: false

server:
  address: 0.0.0.0
  port: 8080
#  tomcat:

logging:
  level:
    com.atrastones: debug
    com.zaxxer.hikari.HikariConfig: debug
  charset:
    console: UTF-8

#################################### VARIABLES #################################

sms:
  url: ${MELIPAYAMAK.URL}
  from: ${MELIPAYAMAK.FROM}
  password: ${MELIPAYAMAK.PASSWORD}
  username: ${MELIPAYAMAK.USERNAME}